[project]
name = "qiskitfallfest-emsi-quantumafrica"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "optuna>=5.1.0",
    "pandas>=3.1.1",
    "qiskit>=2.6.2",
    "qiskit-ibm-runtime>=0.52.1",
    "qiskit-machine-learning>=0.9.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
